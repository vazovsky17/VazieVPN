name: Release

# Builds, verifies and — when the signing material is present — signs the artifacts for a version tag.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Endpoints come from repository secrets (or variables); the build stops if one is missing.
env:
  VAZIE_API_URL: ${{ secrets.VAZIE_API_URL || vars.VAZIE_API_URL }}
  VAZIE_VPN_API_URL: ${{ secrets.VAZIE_VPN_API_URL || vars.VAZIE_VPN_API_URL }}
  VAZIE_SITE_URL: ${{ secrets.VAZIE_SITE_URL || vars.VAZIE_SITE_URL }}
  VAZIE_RELEASE_FORBIDDEN_HOSTS: ${{ secrets.VAZIE_RELEASE_FORBIDDEN_HOSTS }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # The environment is what gates signing.
    environment: release

    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      # The pinned Gradle, and the wrapper jar generated from it and validated.
      - uses: ./.github/actions/gradle

      # A tag must describe the source it points at, otherwise the artifacts and the version a user
      # sees in the app disagree.
      - name: Check tag matches versionName
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^vazieVersionName = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match vazieVersionName $version"
            exit 1
          fi
          echo "version $version"

      # A tag build that cannot sign is a failure, not a warning.
      - name: Place the signing key, or refuse to build a release without it
        env:
          KEYSTORE_BASE64: ${{ secrets.VAZIE_KEYSTORE_BASE64 }}
          VAZIE_KEYSTORE_PASSWORD: ${{ secrets.VAZIE_KEYSTORE_PASSWORD }}
          VAZIE_KEY_ALIAS: ${{ secrets.VAZIE_KEY_ALIAS }}
          VAZIE_KEY_PASSWORD: ${{ secrets.VAZIE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing VAZIE_KEYSTORE_BASE64"
          [ -n "$VAZIE_KEYSTORE_PASSWORD" ] || missing="$missing VAZIE_KEYSTORE_PASSWORD"
          [ -n "$VAZIE_KEY_ALIAS" ] || missing="$missing VAZIE_KEY_ALIAS"
          [ -n "$VAZIE_KEY_PASSWORD" ] || missing="$missing VAZIE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::signing secrets are not configured for the release environment:$missing; a release cannot be built unsigned"
            exit 1
          fi
          keystore="$RUNNER_TEMP/vazie-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "VAZIE_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Check
        env:
          VAZIE_KEYSTORE_PASSWORD: ${{ secrets.VAZIE_KEYSTORE_PASSWORD }}
          VAZIE_KEY_ALIAS: ${{ secrets.VAZIE_KEY_ALIAS }}
          VAZIE_KEY_PASSWORD: ${{ secrets.VAZIE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon check

      # APKs first, then the bundle, in two invocations.
      - name: Build release APKs
        env:
          VAZIE_KEYSTORE_PASSWORD: ${{ secrets.VAZIE_KEYSTORE_PASSWORD }}
          VAZIE_KEY_ALIAS: ${{ secrets.VAZIE_KEY_ALIAS }}
          VAZIE_KEY_PASSWORD: ${{ secrets.VAZIE_KEY_PASSWORD }}
          # Crash and payment reports (opt-in in the app). Absent = a build that reports nothing.
          APPMETRICA_API_KEY: ${{ secrets.APPMETRICA_API_KEY }}
        run: ./gradlew --no-daemon :app:assembleDirectRelease :app:lintDirectRelease

      - name: Scan the release artifact
        run: ./gradlew --no-daemon :app:checkReleaseGraph :app:checkReleaseArtifact

      - name: Build the Play bundle
        env:
          VAZIE_KEYSTORE_PASSWORD: ${{ secrets.VAZIE_KEYSTORE_PASSWORD }}
          VAZIE_KEY_ALIAS: ${{ secrets.VAZIE_KEY_ALIAS }}
          VAZIE_KEY_PASSWORD: ${{ secrets.VAZIE_KEY_PASSWORD }}
          APPMETRICA_API_KEY: ${{ secrets.APPMETRICA_API_KEY }}
        run: ./gradlew --no-daemon :app:bundlePlayRelease

      # Checksums for the direct download, so somebody who sideloads can verify what they got.
      # Published beside the APK; the file names are the artifact names, and nothing else is in it.
      - name: Checksums for the direct APKs
        run: |
          cd app/build/outputs/apk/direct/release
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # R8 mapping, native symbols and the dependency inventory, kept longer than the artifacts.
      - name: Upload mapping and symbols
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vazie-${{ github.ref_name }}-diagnostics
          path: |
            app/build/outputs/mapping/*/mapping.txt
            app/build/outputs/native-debug-symbols/*/native-debug-symbols.zip
          retention-days: 90
          if-no-files-found: warn

      - name: Upload signed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vazie-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/*/release/*.apk
            app/build/outputs/apk/*/release/SHA256SUMS.txt
            app/build/outputs/bundle/*Release/*.aab
          retention-days: 14
          if-no-files-found: error

# Publishing
